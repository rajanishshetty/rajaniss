{% extends "base.html" %}
{% block content %}
<h2>Add New Order</h2>
<form method="post">
    Order Date (YYYY-MM-DD): <input type="date" name="order_date" required><br><br>
    Customer Address: <textarea name="customer_address" required></textarea><br><br>
    Phone Number: <input type="text" name="phone_number" required><br><br>
    Order Details: <textarea name="order_details" required></textarea><br><br>
    Order Amount: <input type="number" step="0.01" name="order_amount" required><br><br>
    <input type="submit" value="Add Order">
</form>
{% endblock %}
