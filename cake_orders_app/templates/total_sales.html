{% extends "base.html" %}
{% block content %}

<div style="text-align:center; padding:2rem 1rem;">
    <h2 class="page-title" style="margin-bottom:0.3rem;">Total Sales</h2>
    <p class="page-subtitle" style="margin-bottom:2rem;">Lifetime revenue for Gourmets-Crafts</p>

    <div style="display:inline-block; margin-bottom:2.5rem;">
        <div class="stat-block">
            <span class="stat-label">Total Revenue</span>
            <span class="stat-value">${{ "%.2f"|format(total) }}</span>
        </div>
    </div>

    <div>
        <a href="/reports" class="btn btn-outline">← Back to Reports</a>
    </div>
</div>

{% endblock %}
